{% extends "base.html" %}
{% block title %}Add a vehicle{% endblock %}
{% block content %}
<div class="page" style="max-width: 420px;">
    <div class="page-header">
        <h1>Add a vehicle</h1>
        <p>Register another vehicle under your account.</p>
    </div>
    <div class="card">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn">Add vehicle</button>
        </form>
    </div>
</div>
{% endblock %}
